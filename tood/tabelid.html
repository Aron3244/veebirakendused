<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tabelid HTML keelse</title>
    <link rel="stylesheet" href="tabeliStyle.css">
    <link rel="stylesheet" href="LipuStyle.css">
</head>
<body>
<h1>Tabelid HTML-keeles</h1>
<h2>Kõige lihtsam tabel</h2>
<table id ="sinine">
    <caption>Table 1. </caption>
    <!--1-rida-->
    <tr>
        <td>1</td>
        <td>2</td>
    </tr>
    <!--2.-rida-->
    <tr>
        <td>3</td>
        <td>4</td>
    </tr>
</table>
<h2>Nätuke keerulisem tabel</h2>
<table id ="punane">
    <caption>Table 2. </caption>
    <!--1-rida-->
    <tr>
        <td colspan="2">1</td>
    </tr>
    <!--2.-rida-->
    <tr>
        <td>3</td>
        <td>4</td>
    </tr>
</table>
<h2>Veel üks natuke keerulisem tabel</h2>
<table id ="roheline">
    <caption>Table 3. </caption>
    <!--1-rida-->
    <tr>
        <td rowspan="2">1</td>
        <td>2</td>
    </tr>
    <!--2.-rida-->
    <tr>
        <td>4</td>
    </tr>
</table>

<table id="eesti">
    <caption>Eesti lipp</caption>
    <tr>
        <td></td>
    </tr>
    <tr>
        <td></td>
    </tr>
    <tr>
        <td></td>
    </tr>
</table>


</body>
</html>
