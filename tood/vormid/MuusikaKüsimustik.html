<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Muusika Küsimustik</title>
    <script>
        function MuusikaKuulamisArv(){
            let tund = document.getElementById("tund");
            let vastus = document.getElementById("vastus");
            vastus.innerHTML = tund.value + " tundi";
            return tund.value;
        }

        function muusikValik(){
            let vastus2 = document.getElementById("vastus2");
            let eeva = document.getElementById("eeva_talsi");
            let villu = document.getElementById("villu_tamme");
            let tonu = document.getElementById("tonu_trubetsky");
            let muu = document.getElementById("muu");

            let muusik = "";
            if(eeva.checked) { muusik = eeva.value; }
            else if(villu.checked) { muusik = villu.value; }
            else if(tonu.checked) { muusik = tonu.value; }
            else if(muu.checked) { muusik = muu.value; }

            vastus2.innerHTML = "valitud muusik on " + muusik;
            vastus2.style.color = "darkblue";
            return muusik;
        }

        function arvamusLugemine(){
            let muusika = document.getElementById("Muusika");
            let vastusArvamus = document.getElementById("vastusArvamus");
            vastusArvamus.innerHTML = muusika.value;
            return muusika.value;
        }

        function raadioValik(){
            let vastusRaadio = document.getElementById("vastusRaadio");
            let jah = document.getElementById("Jah");
            let ei = document.getElementById("Ei");

            let raadio = "";
            if(jah.checked) { raadio = jah.value; }
            else if(ei.checked) { raadio = ei.value; }

            vastusRaadio.innerHTML = "raadio kuulamine: " + raadio;
            return raadio;
        }

        function jaamadLugemine(){
            let radio = document.getElementById("Radio");
            let vastusJaamad = document.getElementById("vastusJaamad");
            vastusJaamad.innerHTML = radio.value;
            return radio.value;
        }

        function zanriValik(){
            let vastus3 = document.getElementById("vastus3");
            let rock = document.getElementById("Rock");
            let classic = document.getElementById("Classic");
            let pop = document.getElementById("Pop");

            let sport = "";
            if(rock.checked) { sport += rock.value + ", "; }
            if(classic.checked) { sport += classic.value + ", "; }
            if(pop.checked) { sport += pop.value + " "; }

            if (sport == "") { sport = "sa ei vali žanrit"; }

            vastus3.innerHTML = sport;
            return sport;
        }

        function tervitus(){
            let vastus4 = document.getElementById("koondvastus");
            let tund = MuusikaKuulamisArv();
            let muusik = muusikValik();
            let arvamus = arvamusLugemine();
            let raadio = raadioValik();
            let jaamad = jaamadLugemine();
            let zanr = zanriValik();

            vastus4.innerHTML = 'Tunde päevas: ' + tund + '<br>'
                + 'Lemmikmuusik: ' + muusik + '<br>'
                + 'Arvamus koolis: ' + arvamus + '<br>'
                + 'Kuulab raadiot: ' + raadio + '<br>'
                + 'Raadiojaamad: ' + jaamad + '<br>'
                + 'Muusikastiilid: ' + zanr;

            vastus4.style.backgroundColor = "darkblue";
        }

        function puhasta(){
            document.getElementById("vastus").innerHTML = "";
            document.getElementById("vastus2").innerHTML = "";
            document.getElementById("vastusArvamus").innerHTML = "";
            document.getElementById("vastusRaadio").innerHTML = "";
            document.getElementById("vastusJaamad").innerHTML = "";
            document.getElementById("vastus3").innerHTML = "";
            document.getElementById("koondvastus").innerHTML = "";
            document.getElementById("koondvastus").style.backgroundColor = "transparent";
        }
    </script>
</head>

<body>
<h1>Muusika Küsimustik</h1>
<form action="#">

    <table border="1">
        <tr>
            <td>Mitu tundi paevas sa kuulad muusikat?</td>
            <td>
                <input type="number" min="0" max="24" step="1" value="0" id="tund" oninput="MuusikaKuulamisArv()">
            </td>
            <td >
                <div id="vastus"></div>
            </td>
        </tr>

        <tr>
            <td>Vali muusik:</td>
            <td>
                <input type="radio" name="Muusikud" id="eeva_talsi" value="Eeva Talsi" onclick="muusikValik()">
                <label for="eeva_talsi">Eeva Talsi</label>
                <br>
                <input type="radio" name="Muusikud" id="villu_tamme" value="Villu Tamme" onclick="muusikValik()">
                <label for="villu_tamme">Villu Tamme</label>
                <br>
                <input type="radio" name="Muusikud" id="tonu_trubetsky" value="Tõnu Trubetsky" onclick="muusikValik()">
                <label for="tonu_trubetsky">Tõnu Trubetsky</label>
                <br>
                <input type="radio" name="Muusikud" id="toomas_sularaha" value="Toomas Sularaha" onclick="muusikValik()">
                <label for="toomas_sularaha">Tooms Sularaha</label>
                <br>
                <input type="radio" name="Muusikud" id="muu" value="muu" onclick="muusikValik()">
                <label for="muu">Muu</label>
            </td>
            <td width="250">
                <div id="vastus2"></div>
            </td>
        </tr>

        <tr>
            <td><label for="Muusika">Mida arvad muusika kuulamisest koolis?</label></td>
            <td>
                <input type="text" id="Muusika" oninput="arvamusLugemine()">
            </td>
            <td width="250">
                <div id="vastusArvamus"></div>
            </td>
        </tr>

        <tr>
            <td>Kas sa kuulad raadiot?</td>
            <td>
                <input type="radio" name="raadio_kuulamine" id="Jah" value="Jah" onclick="raadioValik()">
                <label for="Jah">Jah</label>
                <br>
                <input type="radio" name="raadio_kuulamine" id="Ei" value="Ei" onclick="raadioValik()">
                <label for="Ei">Ei</label>
            </td>
            <td width="250">
                <div id="vastusRaadio"></div>
            </td>
        </tr>

        <tr>
            <td><label for="Radio">Milliseid raadiojaamu oskad nimetada?</label></td>
            <td>
                <input type="text" id="Radio" oninput="jaamadLugemine()">
            </td>
            <td width="250">
                <div id="vastusJaamad"></div>
            </td>
        </tr>

        <tr>
            <td>Millist muusikat sa kõige rohkem kuulad?</td>
            <td>
                <input type="checkbox" name="MuusikaStiil" id="Rock" value="Rock" onchange="MuusikaStiiliValik()">
                <label for="Rock">Rock</label>
                <br>
                <input type="checkbox" name="MuusikaStiil" id="Classic" value="Classic" onchange="MuusikaStiiliValik()">
                <label for="Classic">Classic</label>
                <br>
                <input type="checkbox" name="MuusikaStiil" id="Pop" value="Pop" onchange="MuusikaStiiliValik()">
                <label for="Pop">Pop</label>
            </td>
            <td width="250">
                <div id="vastus3"></div>
            </td>
        </tr>

        <tr>
            <td>
                <input type="reset" value="Puhasta" onclick="puhasta()">
            </td>
            <td>
                <input type="button" value="Näita andmed" onclick="tervitus()">
            </td>
            <td width="250">
                <div id="koondvastus"></div>
            </td>
        </tr>
    </table>

</form>
</body>
</html>
