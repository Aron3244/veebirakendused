<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Tabelid HTML-keeles</title>
    <link rel="stylesheet" href="tabeliStyle.css">
</head>
<body>
<h1>Tabelid HTML-keeles</h1>
<h2>Kõige lihtsam tabel</h2>
<table id="crimson">
    <caption>Tabel 1.</caption>
    <!--1.rida-->
    <tr>
        <td>1</td>
        <td>2</td>
    </tr>
    <!--2.rida-->
    <tr>
        <td>3</td>
        <td>4</td>
    </tr>
</table>

<h2>Natuke keerulisem tabel</h2>
<table id="sinine">
    <caption>Tabel 2.</caption>
    <!--1.rida-->
    <tr>
        <td colspan="2">1</td>
    </tr>
    <!--2.rida-->
    <tr>
        <td>3</td>
        <td>4</td>
    </tr>
</table>

<h2>Veel üks natuke keerulisem tabel</h2>
<table id="roheline">
    <caption>Tabel 3.</caption>
    <!--1.rida-->
    <tr>
        <td rowspan="2">1</td>
        <td>2</td>
    </tr>
    <!--2.rida-->
    <tr>
        <td>4</td>
    </tr>

    <h2>Keeruline tabel</h2>
</table>
<table id="gold">
    <caption>Tabel 4.</caption>
    <!--1.rida-->
    <tr>
        <td rowspan="4">A</td>
        <td colspan="3">B</td>
    </tr>
    <!--2.rida-->
    <tr>
        <td colspan="2">C</td>
        <td>D</td>
    </tr>
    <!--3.rida-->
    <tr>
        <td>E</td>
        <td>F</td>
        <td rowspan="2">J</td>
    </tr>
    <!--4.rida-->
    <tr>
        <td>G</td>
        <td>H</td>
    </tr>
</table>
<h1>Lipud</h1>
<table id="eesti"></table>
<caption>Eesti lipp</caption>
<<table>

</table>

</body>
</html>
